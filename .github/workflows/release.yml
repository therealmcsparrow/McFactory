name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          tag="${TAG#v}"
          if [ "${tag%%-*}" != "$want" ]; then
            echo "::error::Tag $TAG does not match version $want in desktop/src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Tests
        run: npm test

      - name: Install desktop build tools
        working-directory: desktop
        run: npm ci

      - name: Build the installer
        working-directory: desktop
        run: npm run build

      - name: Collect release files
        run: |
          mkdir -p out
          # GitHub turns spaces in asset names into dots, so name the file that way before the checksum
          for f in desktop/src-tauri/target/release/bundle/nsis/*.exe; do
            b="$(basename "$f")"
            cp "$f" "out/${b// /.}"
          done
          (cd out && sha256sum *.exe > SHA256SUMS.txt)
          ls -l out

      - name: Release title (the tag without the v)
        id: title
        env:
          TAG: ${{ github.ref_name }}
        run: echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/*.exe

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ steps.title.outputs.name }}
          files: |
            out/*.exe
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          # a tag with a hyphen (v0.2.0-beta.1) is a pre-release and never takes the Latest badge
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
